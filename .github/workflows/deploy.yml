name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      supabase: ${{ steps.filter.outputs.supabase }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            supabase:
              - 'supabase/**'

  migrate:
    name: Apply Supabase migrations
    needs: changes
    if: ${{ github.event_name != 'pull_request' && needs.changes.outputs.supabase == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Link project and push migrations
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail

          : "${SUPABASE_ACCESS_TOKEN:?Add the SUPABASE_ACCESS_TOKEN organisation secret}"
          : "${SUPABASE_DB_PASSWORD:?Add the SUPABASE_DB_PASSWORD organisation secret}"

          PROJECT_NAME="jdnhlf-${GITHUB_REPOSITORY#*/}"

          projects=$(curl --fail-with-body -sS \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects")

          project_ref=$(jq -r --arg name "$PROJECT_NAME" \
            'first(.[] | select(.name == $name) | .id) // empty' <<< "$projects")

          if [ -z "$project_ref" ]; then
            echo "No Supabase project named $PROJECT_NAME. Run the Bootstrap workflow first." >&2
            exit 1
          fi

          echo "Linking Supabase project $PROJECT_NAME ($project_ref)"
          supabase link --project-ref "$project_ref"
          supabase db push --remote --yes

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test:unit

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_test
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        run: pnpm build

      - name: Run end-to-end tests
        run: pnpm test:e2e

  deploy:
    name: Deploy to Vercel
    needs: [changes, format, lint, unit, e2e, migrate]
    if: ${{ always() && github.event_name != 'pull_request' && needs.changes.result == 'success' && needs.format.result == 'success' && needs.lint.result == 'success' && needs.unit.result == 'success' && needs.e2e.result == 'success' && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Vercel CLI
        run: pnpm add -g vercel

      - name: Link Vercel project
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail

          : "${VERCEL_TOKEN:?Add the VERCEL_TOKEN organisation secret}"

          PROJECT_NAME="jdnhlf-${GITHUB_REPOSITORY#*/}"
          vercel link --yes --project "$PROJECT_NAME" --token "$VERCEL_TOKEN"

      - name: Pull Vercel environment
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token "$VERCEL_TOKEN"

      - name: Build
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail

          : "${VERCEL_TOKEN:?Add the VERCEL_TOKEN organisation secret}"

          export NEXT_PUBLIC_APP_NAME="${GITHUB_REPOSITORY#*/}"
          vercel build --prod --token "$VERCEL_TOKEN"

      - name: Deploy
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail

          # Hobby teams cannot add members, so a deployment carrying the bot commit author is blocked; hiding the checkout drops that attribution.
          mv .git .git-no-vercel
          trap 'mv .git-no-vercel .git' EXIT

          vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN" | tee /tmp/deploy-url

          {
            echo "### Deployment"
            echo ""
            echo "$(tail -1 /tmp/deploy-url)"
          } >> "$GITHUB_STEP_SUMMARY"
